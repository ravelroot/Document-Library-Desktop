# Lume: servidor local só para a janela do próprio computador.
spring.application.name=lume
spring.main.banner-mode=off
spring.jmx.enabled=false

server.address=127.0.0.1
server.port=47820
server.error.whitelabel.enabled=false
server.tomcat.threads.max=32
server.tomcat.connection-timeout=30s
spring.mvc.problemdetails.enabled=false
spring.servlet.multipart.enabled=false

# Arquivos da interface (CSS, JS, fontes, pdf.js): uma hora de cache na janela.
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-private=true

# O PDFBox avisa de cada fonte que falta num PDF; só os erros interessam.
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
logging.level.root=INFO
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=3
