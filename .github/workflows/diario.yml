name: Atividade diária

# Dois registros por dia em .github/atividade.txt: 1º turno às 10:47 e 2º turno às 20:26 (Brasília, UTC-3).
# O GitHub atrasa ou descarta execuções agendadas em horários cheios, por isso:
#   - todos os horários caem em minutos "quebrados" (longe de :00, :15, :30 e :45);
#   - cada turno tem horários reserva; o primeiro que rodar registra e os outros só conferem;
#   - a data do registro vem do horário AGENDADO, não da hora em que a execução começou. Uma execução do
#     2º turno que atrase e passe da meia-noite continua contando para o dia certo.

on:
  schedule:
    # 1º turno: 10:47 · reservas 12:09, 13:53 e 16:17 (Brasília)
    - cron: "47 13 * * *"
    - cron: "9 15 * * *"
    - cron: "53 16 * * *"
    - cron: "17 19 * * *"
    # 2º turno: 20:26 · reservas 21:58 e 23:11 (Brasília)
    - cron: "26 23 * * *"
    - cron: "58 0 * * *"
    - cron: "11 2 * * *"
  workflow_dispatch:
    inputs:
      turno:
        description: Turno a registrar (data de hoje, em Brasília)
        type: choice
        options:
          - 1º turno
          - 2º turno
        default: 1º turno

permissions:
  contents: write

concurrency:
  group: atividade-diaria
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Só a pasta .github: o Lume.exe não precisa ser baixado para registrar a atividade.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
          filter: blob:none

      - name: Registrar atividade
        env:
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          AGENDA: ${{ github.event.schedule }}
          TURNO_MANUAL: ${{ inputs.turno }}
        run: |
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "Defina os secrets GIT_NAME e GIT_EMAIL no repositório."
            exit 1
          fi
          export TZ=America/Sao_Paulo
          case "$AGENDA" in
            "47 13 * * *"|"9 15 * * *"|"53 16 * * *"|"17 19 * * *") TURNO="1º turno" ;;
            "26 23 * * *"|"58 0 * * *"|"11 2 * * *") TURNO="2º turno" ;;
            *) TURNO="${TURNO_MANUAL:-1º turno}" ;;
          esac
          if [ -n "$AGENDA" ]; then
            # Último momento (em UTC) em que este cron deveria ter disparado, até agora; a data do turno é a
            # data em Brasília desse momento, mesmo que a execução tenha começado horas depois.
            MINUTO=$(echo "$AGENDA" | cut -d' ' -f1)
            HORA=$(echo "$AGENDA" | cut -d' ' -f2)
            AGORA=$(date -u +%s)
            PREVISTO=$(date -u -d "$(date -u +%Y-%m-%d) $HORA:$MINUTO" +%s)
            if [ "$PREVISTO" -gt "$AGORA" ]; then PREVISTO=$((PREVISTO - 86400)); fi
            HOJE=$(date -d "@$PREVISTO" +%Y-%m-%d)
            echo "Agendado para $(date -d "@$PREVISTO" '+%d/%m/%Y %H:%M') (Brasília); atraso de $(( (AGORA - PREVISTO) / 60 )) min."
          else
            HOJE=$(date +%Y-%m-%d)
          fi
          ARQUIVO=.github/atividade.txt
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git pull --rebase --quiet origin main
          if grep -q "^$HOJE $TURNO " "$ARQUIVO" 2>/dev/null; then
            echo "A atividade de $HOJE ($TURNO) já foi registrada."
            exit 0
          fi
          echo "$HOJE $TURNO $(date +%H:%M) (Brasília)" >> "$ARQUIVO"
          tail -n 60 "$ARQUIVO" > "$ARQUIVO.tmp" && mv "$ARQUIVO.tmp" "$ARQUIVO"
          git add "$ARQUIVO"
          git commit -m "Atividade de $(date -d "$HOJE" +%d/%m/%Y) ($TURNO)"
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((tentativa * 15))
            git pull --rebase origin main
          done
          echo "Não foi possível enviar o commit depois de 3 tentativas."
          exit 1
